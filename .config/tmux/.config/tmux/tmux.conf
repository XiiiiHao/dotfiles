# ===========================
# Prefix and base
# ===========================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off
set -g repeat-time 300

set -s escape-time 0
set -s focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u
# Explicit indexes keep reloads from appending duplicate features.
set -s terminal-features[10] 'xterm*:extkeys:RGB'
set -s terminal-features[11] 'xterm-kitty:clipboard:ccolour:cstyle:focus:title:extkeys:RGB'
setw -g xterm-keys on
set -g default-terminal 'tmux-256color'

set -g detach-on-destroy off
set -g allow-passthrough on
set -g default-shell /bin/zsh

# Keep Wayland/DBus/input method access current when attaching. Do not copy
# the outer terminal's TERM into panes. Replacing the array is reload-safe.
set -g update-environment 'DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_SESSION_ID XDG_MENU_PREFIX XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME DBUS_SESSION_BUS_ADDRESS QT_IM_MODULE GTK_IM_MODULE XMODIFIERS SESSION_MANAGER FZF_DEFAULT_OPTS'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
setw -g allow-rename off
setw -g mode-keys vi

# ===========================
# Split (all new panes inherit the working directory)
# ===========================
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h split-window -h -b -c '#{pane_current_path}'
bind j split-window -v -c '#{pane_current_path}'
bind k split-window -v -b -c '#{pane_current_path}'
bind l split-window -h -c '#{pane_current_path}'

# ===========================
# Pane navigation and resizing (Alt, no prefix)
# ===========================
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Remove the previous prefix + Shift-H/J/K/L bindings on reload as well.
unbind -q H
unbind -q J
unbind -q K
unbind -q L
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ===========================
# Windows and sessions
# ===========================
bind c new-window -c '#{pane_current_path}'
bind -n M-Left previous-window
bind -n M-Right next-window
bind Tab last-window

unbind 0
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
bind -n M-1 select-window -t ':=1'
bind -n M-2 select-window -t ':=2'
bind -n M-3 select-window -t ':=3'
bind -n M-4 select-window -t ':=4'
bind -n M-5 select-window -t ':=5'
bind -n M-6 select-window -t ':=6'
bind -n M-7 select-window -t ':=7'
bind -n M-8 select-window -t ':=8'
bind -n M-9 select-window -t ':=9'
bind -n M-s choose-tree -Zs
bind -n C-Left switch-client -p
bind -n C-Right switch-client -n

bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'

# ===========================
# Copy and system clipboard (Wayland)
# ===========================
bind Enter copy-mode
bind -n M-v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
set -s copy-command 'sh ~/.config/tmux/scripts/copy-to-clipboard.sh'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Default Enter and mouse selection also use copy-command.

bind ] run-shell 'sh ~/.config/tmux/scripts/paste-from-clipboard.sh #{q:pane_id}'
bind -n C-S-v run-shell 'sh ~/.config/tmux/scripts/paste-from-clipboard.sh #{q:pane_id}'
bind -T copy-mode-vi C-S-v run-shell 'sh ~/.config/tmux/scripts/paste-from-clipboard.sh #{q:pane_id}'
bind -T copy-mode C-S-v run-shell 'sh ~/.config/tmux/scripts/paste-from-clipboard.sh #{q:pane_id}'
# Kitty's tmux_paste.py forwards Ctrl+Shift+V while tmux is in the foreground;
# outside tmux, Kitty still performs its normal native clipboard paste.

# ===========================
# Catppuccin Mocha (load palette before our custom single-line layout)
# ===========================
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'none'
set -g @catppuccin_status_background '#{@thm_bg}'
set -g @catppuccin_pane_status_enabled 'no'
set -g @catppuccin_pane_border_style 'fg=#{@thm_overlay_0}'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_mauve}'
source-file -q ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf
source-file -q ~/.tmux/plugins/tmux/catppuccin_tmux.conf

# ===========================
# Pane background
# ===========================
# Neovim in a terminal is transparent (Normal has no background); without this
# it reveals Kitty's #373b4b and looks washed out next to Neovide's #222435.
set -g window-style 'bg=#222435'
set -g window-active-style 'bg=#222435'

# ===========================
# Pane borders: active highlight, no pane titles
# ===========================
setw -g pane-border-status off
setw -g pane-border-style 'fg=#{@thm_overlay_0}'
setw -g pane-active-border-style 'fg=#{@thm_mauve}'
setw -g pane-border-format ''
setw -g mode-style 'bg=#{@thm_surface_0},bold'
set -gF display-panes-active-colour '#{@thm_mauve}'
set -gF display-panes-colour '#{@thm_fg}'

# ===========================
# Single-line status: arrow tabs using the Catppuccin palette
# ===========================
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#{@thm_bg},fg=#{@thm_fg}'
set -g status-left-length 40
set -g status-right-length 90
set -g status-left '#[fg=#{@thm_mauve},bold] #S #[default] '
set -g status-right '#{?client_prefix,#[fg=#{@thm_bg}]#[bg=#{@thm_yellow}]#[bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#{@thm_teal}] COPY #[default],}#{?window_zoomed_flag,#[fg=#{@thm_mauve}] ZOOM #[default],}#[fg=#{@thm_subtext_0}] #H | %Y-%m-%d %H:%M '
setw -g window-status-style 'bg=#{@thm_bg},fg=#{@thm_teal}'
setw -g window-status-current-style 'bg=#{@thm_bg},fg=#{@thm_teal},bold'
# Powerline separators create a notch on the left and an arrow on the right.
setw -g window-status-format '#[fg=#{@thm_bg},bg=#{@thm_surface_0},nobold]#[fg=#{@thm_teal},bg=#{@thm_surface_0}] #I:#W #[fg=#{@thm_surface_0},bg=#{@thm_bg}]#[default]'
setw -g window-status-current-format '#[fg=#{@thm_bg},bg=#{@thm_teal},nobold]#[fg=#{@thm_bg},bg=#{@thm_teal},bold] #I:#W #[fg=#{@thm_teal},bg=#{@thm_bg},nobold]#[default]'
setw -g window-status-separator ' '
set -g message-style 'bg=#{@thm_surface_0},fg=#{@thm_fg}'
set -g message-command-style 'bg=#{@thm_surface_0},fg=#{@thm_mauve}'

# ===========================
# Plugins: local downloads and runtime snapshots stay outside dotfiles
# ===========================
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save 'C-s'
set -g @resurrect-restore 'C-r'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# Install missing plugins with: sh ~/.config/tmux/scripts/install-plugins.sh
# Continuum must initialize after status-right is set (including on reload).
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' {
    run-shell ~/.tmux/plugins/tpm/tpm
    # Archive installs use our bootstrap, not TPM's Git installer/updater/cleaner.
    bind I run-shell 'sh ~/.config/tmux/scripts/install-plugins.sh' \; source-file ~/.config/tmux/tmux.conf
    bind U display-message 'Plugins use pinned archives; see ~/.config/tmux/README.md for upgrades'
    unbind -q M-u
}
