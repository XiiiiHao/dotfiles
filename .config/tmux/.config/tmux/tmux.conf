# ===========================
# Prefix
# ===========================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===========================
# Base
# ===========================
set -g mouse on
set -g history-limit 100000
set -g bell-action none
set -g visual-bell off

# Server options (新语法，-g 用于这些项在 tmux 3.x 已废弃)
set -s escape-time 0
set -s repeat-time 300
set -s focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Keyboard compatibility
setw -g xterm-keys on

# Session behavior
set -g detach-on-destroy off
set -g allow-passthrough on
set -g default-shell /bin/zsh
set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# Environment sync on attach
# Wayland 图形会话 + fcitx5 输入法 + 剪贴板/DBus 需要这些变量
# 否则 tmux 内启动的程序可能连不上 input method 或系统剪贴板
# 注意：tmux 已内置 DISPLAY/WAYLAND_DISPLAY/XDG_SESSION_TYPE 等默认项，
# 这里只追加默认列表里没有的变量，避免重复。
set -ga update-environment 'XDG_RUNTIME_DIR XDG_SESSION_ID XDG_MENU_PREFIX XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME DBUS_SESSION_BUS_ADDRESS QT_IM_MODULE GTK_IM_MODULE XMODIFIERS SESSION_MANAGER FZF_DEFAULT_OPTS'

# Vi Mode
setw -g mode-keys vi

# 256 Color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ===========================
# Split
# ===========================
unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ===========================
# Pane Navigation
# ===========================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize Pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===========================
# Window
# ===========================
bind c new-window -c "#{pane_current_path}"

bind -n M-Left previous-window
bind -n M-Right next-window

bind Tab last-window

# ===========================
# Reload Config
# ===========================
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ===========================
# Copy Mode
# ===========================
bind Enter copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===========================
# Status
# ===========================
set -g status-position bottom
set -g status-interval 5

set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#S"
set -g status-right "#H | %Y-%m-%d %H:%M"

# ===========================
# Window Naming
# ===========================
setw -g automatic-rename off

# ===========================
# Index
# ===========================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
