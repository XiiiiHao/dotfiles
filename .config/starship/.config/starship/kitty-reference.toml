# Minimal two-line prompt using the terminal's ANSI palette.
add_newline = false
format = "[\uf06d](purple) $directory$git_branch$git_status$line_break$character"

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false

[line_break]
disabled = false

[character]
success_symbol = "[\u276f](green)"
error_symbol = "[\u276f](red)"
vimcmd_symbol = "[\u276e](green)"
vimcmd_replace_one_symbol = "[\u276e](purple)"
vimcmd_replace_symbol = "[\u276e](purple)"
vimcmd_visual_symbol = "[\u276e](yellow)"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "\ue725 "
style = "purple"
truncation_length = 24

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${count} "
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
